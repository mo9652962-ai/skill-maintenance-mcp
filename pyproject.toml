[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skill-maintenance-mcp"
version = "0.1.0"
description = "技能库维护 MCP server：损坏扫描/备份/决策日志/体检（skill-evolution 机械环节工具化）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "sora" }]
dependencies = [
    "fastmcp>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
skill-maintenance-mcp = "skill_maintenance_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/skill_maintenance_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
