[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skill-maintenance-mcp"
version = "0.1.1"
description = "技能库维护 MCP server：损坏扫描/备份/决策日志/体检（skill-evolution 机械环节工具化）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "sora" }]
keywords = ["mcp", "fastmcp", "agent", "skills", "maintenance", "tooling", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "fastmcp>=2.0",
]

[project.urls]
Repository = "https://github.com/mo9652962-ai/skill-maintenance-mcp"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "bandit>=1.8",
]

[project.scripts]
skill-maintenance-mcp = "skill_maintenance_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/skill_maintenance_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
